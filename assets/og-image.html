<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og-image</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #0d0e12;
        color: #fff;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
      }
      .glow {
        position: absolute;
        top: -260px;
        left: 40%;
        width: 820px;
        height: 820px;
        background: radial-gradient(circle, #ff5500 0%, #ff5500 35%, transparent 70%);
        filter: blur(150px);
        opacity: 0.35;
      }
      .grid-bg {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at 22% 45%, #000 0%, transparent 72%);
      }
      .content {
        position: relative;
        display: flex;
        align-items: center;
        gap: 56px;
      }
      .left {
        flex: 1;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px 8px 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: rgba(255, 255, 255, 0.82);
      }
      .badge svg {
        display: block;
        border-radius: 6px;
      }
      h1 {
        margin-top: 28px;
        font-size: 84px;
        line-height: 0.98;
        letter-spacing: -0.035em;
        font-weight: 700;
      }
      h1 .accent {
        color: #ff5500;
      }
      p.sub {
        margin-top: 24px;
        font-size: 28px;
        line-height: 1.35;
        letter-spacing: -0.015em;
        color: rgba(255, 255, 255, 0.68);
        max-width: 22ch;
      }
      /* Miniatur des Blocks: Grid aus Kacheln mit Bildunterschrift */
      .mock {
        width: 440px;
        flex: none;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .tile {
        border-radius: 10px;
        aspect-ratio: 4 / 3;
        background: linear-gradient(160deg, #2b2f3a, #171922);
        position: relative;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
      }
      .tile::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.18), transparent 55%),
          linear-gradient(200deg, rgba(255, 85, 0, 0.5), transparent 65%);
      }
      .tiles figure:nth-child(2) .tile::after {
        background:
          radial-gradient(circle at 60% 25%, rgba(255, 255, 255, 0.16), transparent 55%),
          linear-gradient(160deg, rgba(120, 160, 255, 0.42), transparent 70%);
      }
      .tiles figure:nth-child(3) .tile::after {
        background:
          radial-gradient(circle at 40% 60%, rgba(255, 255, 255, 0.14), transparent 55%),
          linear-gradient(220deg, rgba(255, 205, 100, 0.4), transparent 65%);
      }
      .paper {
        background: #16171d;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 14px;
        padding: 26px 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      .line {
        font-size: 21px;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.9);
      }
      .line sup {
        font-size: 0.62em;
        vertical-align: super;
        line-height: 0;
        color: #ff5500;
        margin-left: 0.12em;
      }
      .marked {
        border-bottom: 2px solid rgba(255, 85, 0, 0.65);
        padding-bottom: 1px;
      }
      .rule {
        height: 1px;
        background: rgba(255, 255, 255, 0.12);
        margin: 22px 0 16px;
      }
      .notes {
        margin-top: 18px;
        list-style: decimal;
        padding-left: 22px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 15px;
      }
      .notes li {
        line-height: 1.6;
      }
      .bar {
        display: inline-block;
        vertical-align: middle;
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.2);
        margin-right: 10px;
      }
      .w80 {
        width: 210px;
      }
      .w60 {
        width: 150px;
      }
      .back {
        color: #ff5500;
        font-size: 14px;
      }

      .rel {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }
      .cover {
        width: 118px;
        height: 118px;
        flex: none;
        border-radius: 8px;
        background: linear-gradient(150deg, #3a2a20, #17181f 60%, #2a1c14);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
      }
      .cover::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 35% 30%, rgba(255, 85, 0, 0.55), transparent 60%);
      }
      .meta {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-top: 2px;
      }
      .rel-title {
        font-size: 22px;
        color: rgba(255, 255, 255, 0.94);
        letter-spacing: -0.01em;
      }
      .rel-artist {
        font-size: 17px;
        color: rgba(255, 255, 255, 0.7);
      }
      .rel-facts {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.45);
      }
      .rel-status {
        font-size: 14px;
        color: #ff5500;
      }
      .known {
        color: rgba(255, 255, 255, 0.82);
        font-size: 15px;
      }
      .tag {
        font-size: 11px;
        color: #ff5500;
        border: 1px solid rgba(255, 85, 0, 0.5);
        border-radius: 999px;
        padding: 1px 7px;
        margin-left: 6px;
        vertical-align: 2px;
      }
      .w70 {
        width: 175px;
      }

      .rev-item {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.45);
      }
      .rev-score {
        font-size: 40px;
        color: rgba(255, 255, 255, 0.95);
        margin-top: 6px;
        letter-spacing: -0.02em;
      }
      .rev-max {
        font-size: 20px;
        color: rgba(255, 255, 255, 0.4);
      }
      .meter {
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        margin: 14px 0 16px;
        overflow: hidden;
      }
      .meter span {
        display: block;
        height: 100%;
        width: 88%;
        background: #ff5500;
        border-radius: inherit;
      }
      .rev-verdict {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.8);
        line-height: 1.45;
      }
      .cols {
        display: flex;
        gap: 26px;
        margin-top: 18px;
      }
      .col-title {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
        margin-bottom: 7px;
      }
      .pt {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.72);
        margin-bottom: 5px;
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 7px;
        vertical-align: 1px;
      }
      .dot.up {
        background: #ff5500;
      }
      .dot.down {
        background: rgba(255, 255, 255, 0.3);
      }
      .ld {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.35);
      }

      .head {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.45);
        margin-bottom: 16px;
      }
      .sec {
        font-size: 12px;
        color: #ff5500;
        margin-bottom: 8px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .sec.enc {
        margin-top: 18px;
      }
      .cols2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 26px;
      }
      .s {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.82);
        margin-bottom: 4px;
        white-space: nowrap;
      }
      .s i {
        display: inline-block;
        width: 22px;
        font-style: normal;
        color: rgba(255, 255, 255, 0.35);
        text-align: right;
        margin-right: 8px;
      }
      .s em {
        font-style: normal;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
        margin-left: 6px;
      }

      .cal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .cal-month {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.85);
      }
      .cal-badges i {
        font-style: normal;
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 999px;
        margin-left: 6px;
      }
      .cal-badges .ig {
        color: #ff5500;
        border: 1px solid rgba(255, 85, 0, 0.5);
      }
      .cal-badges .fb {
        color: rgba(150, 180, 255, 0.9);
        border: 1px solid rgba(150, 180, 255, 0.4);
      }
      .cal-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
        margin-bottom: 6px;
      }
      .cal-weekdays span {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.32);
        text-align: center;
      }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }
      .d {
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 6px;
        min-height: 52px;
        padding: 5px 6px;
      }
      .d.dim {
        opacity: 0.45;
      }
      .d b {
        display: block;
        font-weight: 400;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.4);
        margin-bottom: 4px;
      }
      .ev {
        display: block;
        font-size: 9px;
        line-height: 1.35;
        border-radius: 4px;
        padding: 3px 4px;
      }
      .ev.ig {
        background: rgba(255, 85, 0, 0.22);
        color: #ffb289;
      }
      .ev.fb {
        background: rgba(120, 150, 255, 0.18);
        color: #b9c9ff;
      }
      .footer {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
        font-size: 23px;
        letter-spacing: -0.01em;
        color: rgba(255, 255, 255, 0.92);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 14px 20px;
      }
      .made {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 20px;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid-bg"></div>

    <div class="content">
      <div class="left">
        <span class="badge">
          <!-- Official Sanity monogram, from @sanity/logos (MIT) -->

          </svg>

        </span>

        <h1>Social<br /><span class="accent">Publishing</span></h1>

        <p class="sub">Plan Instagram and Facebook posts inside Sanity &mdash; via Zernio.</p>
      </div>

      <div class="mock">
        <div class="paper">
          <div class="cal-head">
            <span class="cal-month">March 2027</span>
            <span class="cal-badges"><i class="ig">Instagram</i><i class="fb">Facebook</i></span>
          </div>
          <div class="cal-weekdays">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span
            ><span>Sat</span><span>Sun</span>
          </div>
          <div class="cal-grid">
            <div class="d"><b>1</b></div>
            <div class="d"><b>2</b><span class="ev ig">10:00 Reel</span></div>
            <div class="d"><b>3</b></div>
            <div class="d"><b>4</b><span class="ev fb">18:30 Feed</span></div>
            <div class="d"><b>5</b><span class="ev ig">09:00 Carousel</span></div>
            <div class="d dim"><b>6</b></div>
            <div class="d dim"><b>7</b></div>
            <div class="d"><b>8</b><span class="ev ig">12:00 Story</span></div>
            <div class="d"><b>9</b></div>
            <div class="d"><b>10</b><span class="ev fb">08:00 Story</span></div>
            <div class="d"><b>11</b></div>
            <div class="d"><b>12</b><span class="ev ig">17:00 Feed</span></div>
            <div class="d dim"><b>13</b></div>
            <div class="d dim"><b>14</b></div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <code>npm i sanity-plugin-sgntech-zernio</code>

      <span class="made">
        Made for

    </div>
